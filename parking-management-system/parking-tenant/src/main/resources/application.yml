server:
  port: 8090

spring:
  application:
    name: parking-tenant
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/parking_db?useUnicode=true&characterEncoding=utf8&useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.parking: INFO
    org.springframework: WARN
