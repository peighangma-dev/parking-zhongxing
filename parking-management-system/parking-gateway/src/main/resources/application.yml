server:
  port: 8080

spring:
  application:
    name: parking-gateway
  cloud:
    gateway:
      routes:
        - id: barrier-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/barrier/**
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payment/**
        - id: vehicle-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/vehicle/**
        - id: report-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/report/**
        - id: uc-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/uc/**
        - id: space-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/space/**
        - id: oss-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/oss/**
        - id: invoice-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/invoice/**
        - id: monitor-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/monitor/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
  sleuth:
    zipkin:
      base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}

sentinel:
  dashboard:
    host: ${SENTINEL_DASHBOARD_HOST:localhost}
    port: 8858
  gateway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
