server:
  port: 8080

spring:
  application:
    name: parking-gateway
  cloud:
    gateway:
      routes:
        - id: barrier-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/barrier/**
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payment/**
        - id: vehicle-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/vehicle/**
        - id: report-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/report/**
        - id: uc-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/uc/**
        - id: space-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/space/**
        - id: oss-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/oss/**
        - id: invoice-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/invoice/**
        - id: monitor-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/monitor/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
